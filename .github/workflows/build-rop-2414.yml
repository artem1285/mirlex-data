name: Build ROP 2414 database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build and verify rop-2414.json
        run: python build_rop_2414.py

      - name: Commit verified database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rop-2414.json
          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi
          git commit -m "Update verified PP 2414 database"
          git push
