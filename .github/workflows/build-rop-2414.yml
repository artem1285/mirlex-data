name: Build ROP 2414 database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build source database
        run: python build_rop_2414.py

      - name: Build browser runtime database
        run: python build_rop_runtime.py

      - name: Build TN VED index for PP 2414
        run: python build_tnved_2414_index.py

      - name: Refresh semantic TN VED cache
        run: python build_tnved_semantic.py

      - name: Commit verified databases and runtime bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rop-2414.json rop-check.data.js tnved-2414-index.json tnved-semantic-map.json
          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi
          git commit -m "Update verified PP 2414 databases and TN VED semantic cache"
          git push
